services:
  wppconnect:
    container_name: wpp-server
    init: true
    env_file:
      - .env
    environment:
      # Limita el heap de Node.js a 2 GB, evitando que el proceso
      # consuma toda la RAM antes de que el OOM killer del SO actúe.
      - NODE_OPTIONS=--max-old-space-size=2048
    cap_add:
      - SYS_ADMIN # ← requerido por la imagen puppeteer oficial
    shm_size: '1g'
    mem_limit: 3g
    memswap_limit: 4g
    mem_reservation: 1g
    cpus: 2
    restart: unless-stopped
    build:
      context: .
    volumes:
      # ATENCION: el target /usr/src/wpp-server/userDataDir estaba declarado dos
      # veces (bind ./userDataDir + named volume). Compose se queda en silencio
      # con el ultimo, asi que el bind nunca se montaba. Se deja SOLO el named
      # volume, que es donde vive hoy la sesion de WhatsApp.
      - wppconnect_user_data:/usr/src/wpp-server/userDataDir
      - ./wppconnect_tokens:/usr/src/wpp-server/tokens
      # Named volume para el cache de Chrome — persiste entre docker compose down/up
      # sin necesidad de reconstruir la imagen.
      - puppeteer-cache:/home/pptruser/.cache/puppeteer
      - wppconnect_uploads:/usr/src/wpp-server/uploads
      - wppconnect_images:/usr/src/wpp-server/WhatsAppImages
      - wppconnect_logs:/usr/src/wpp-server/log
    ports:
      - '21465:21465'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1:$${WPP_PORT:-21465}/healthz || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - wpp-net
      - wpp-server_default

networks:
  wpp-net:
    driver: bridge
  wpp-server_default:
    driver: bridge

volumes:
  wppconnect_user_data: {}
  wppconnect_uploads: {}
  wppconnect_images: {}
  wppconnect_logs: {}
  # El cache de puppeteer/Chrome vive en un named volume para sobrevivir
  # docker compose down/up sin necesidad de rebuild de imagen.
  puppeteer-cache:
